<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sensei Media Studio | Osmani Karate Club</title><link rel="stylesheet" href="assets/portal.css"><link rel="stylesheet" href="theme-v2.css"></head>
<body><main class="portal-shell"><div class="portal-wrap">

<section class="portal-card"><h2>My Uploads</h2><div id="senseiGallery" class="portal-gallery"></div></section>
</div></main><script src="assets/supabase-config.js"></script><script type="module" src="assets/sensei.js"></script></body></html>
